	<script type="text/javascript">
		//<![CDATA[

		function togglePassword(fieldId, button) {

			var passwordField = document.getElementById(fieldId);
			var icon = button.querySelector("i");

			if (passwordField.type === "password") {

				passwordField.type = "text";

				icon.classList.remove("fa-eye");
				icon.classList.add("fa-eye-slash");

			} else {

				passwordField.type = "password";

				icon.classList.remove("fa-eye-slash");
				icon.classList.add("fa-eye");

			}
		}

		function checkForgotPasswordStrength() {

			var password = document.getElementById("newPassword").value;
			var confirmPassword = document.getElementById("forgotConfirmPassword").value;

			var strengthBox = document.getElementById("forgotPasswordStrength");
			var strengthFill = document.getElementById("forgotStrengthFill");
			var strengthText = document.getElementById("forgotStrengthText");
			var errorMsg = document.getElementById("forgotStrongPasswordError");
			var submitBtn = document.getElementById("resetPasswordBtn");

			if (!password) {
				strengthBox.style.display = "none";
				errorMsg.style.display = "none";
				submitBtn.disabled = true;
				return;
			}

			strengthBox.style.display = "block";

			var hasLength = password.length >= 8;
			var hasUpper = /[A-Z]/.test(password);
			var hasLower = /[a-z]/.test(password);
			var hasNumber = /[0-9]/.test(password);
			var hasSpecial = /[@$!%*#?&]/.test(password);

			if (!(hasLength && hasUpper && hasLower && hasNumber && hasSpecial)) {

				strengthFill.style.width = "33%";
				strengthFill.style.background = "red";
				strengthText.innerHTML = "Weak Password";

				errorMsg.style.display = "block";
				submitBtn.disabled = true;

			} else {

				strengthFill.style.width = "100%";
				strengthFill.style.background = "green";
				strengthText.innerHTML = "Strong Password";

				errorMsg.style.display = "none";

				// Strong hai but confirm password bhi same hona chahiye
				if (password === confirmPassword) {
					submitBtn.disabled = false;
				} else {
					submitBtn.disabled = true;
				}
			}

			checkForgotPasswordMatch();
		}

		function checkForgotPasswordMatch() {

			var password = document.getElementById("newPassword").value;
			var confirmPassword = document.getElementById("forgotConfirmPassword").value;

			var errorMsg = document.getElementById("forgotPasswordError");
			var submitBtn = document.getElementById("resetPasswordBtn");

			if (!confirmPassword) {
				errorMsg.style.display = "none";
				submitBtn.disabled = true;
				return;
			}

			if (password !== confirmPassword) {

				errorMsg.style.display = "block";
				submitBtn.disabled = true;

			} else {

				errorMsg.style.display = "none";

				// Pehle password strong hai ya nahi
				var strong =
					password.length >= 8 &&
					/[A-Z]/.test(password) &&
					/[a-z]/.test(password) &&
					/[0-9]/.test(password) &&
					/[@$!%*#?&]/.test(password);

				submitBtn.disabled = !strong;
			}
		}

		//]]>
