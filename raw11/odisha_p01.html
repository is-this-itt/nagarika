<script>

    // Preloader
    $(window).on('load', function () {
        if ($('#preloader').length) {
            $('#preloader').delay(100).fadeOut('slow', function () {
                $(this).remove();
            });
        }
    });
    function RefreshCaptcha() {
        $(".span-cls").html("");
        $.ajax({
            url: "/Home/RefreshCaptcha",
            method: "POST",
            contentType: 'application/x-www-form-urlencoded',
            dataType: "json",
            headers: {
                'RequestVerificationToken': $('input[name="__RequestVerificationToken"]').val()
            },
            success: function (res) {
                $('#captcha').attr('src', res);
            },
            error: function (err) {

            }
        });
    }
    $("#Captcha, #UserName, #Password").on('keyup', function () {
        $(".span-cls").html('');
    })
    $(document).ready(function () {
        let title = "IPMS";
        if ('MLALADS Login' != null) {
            title = 'MLALADS Login';
        }
        document.title = title;
        ToggleLoginHeader();
    });
</script>

        $(document).on("contextmenu", function (e) {

        $('.secureInput').on("contextmenu", function (e) {

</script>

<script>
    function ToggleLoginHeader(){

              $("#section-cgf-login").hide();
          }
    }
