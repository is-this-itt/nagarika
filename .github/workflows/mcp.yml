name: MCP server tests

on:
  pull_request:
    paths: ["mcp/**", "collector/api.py", "collector/build.py", "data/complaints.json", ".github/workflows/mcp.yml"]
  push:
    branches: [main]
    paths: ["mcp/**", "collector/api.py", "collector/build.py", "data/complaints.json", ".github/workflows/mcp.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collector/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: mcp
