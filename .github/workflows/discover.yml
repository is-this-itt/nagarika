name: Discover sources

# Temporary: fetches sample pages from candidate data sources and commits them to the
# discovery branch so their formats can be studied from a Claude Code session.
on:
  push:
    branches: [discovery]
    paths: [scripts/discover*, .github/workflows/discover.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python scripts/discover5.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add raw5
          git commit -m "Discovery samples 5" && git push
