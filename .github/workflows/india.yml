name: India-only sources

# Runs on a self-hosted runner in India (label "india"; see docs/india-runner.md) for
# sites that refuse requests from outside India. Separate from "Update data and site",
# so the normal collection and deploy never wait for this runner.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "mlalads = MLA fund works; education = state RTE and scholarship portals; all = both (each republishes the site); probe = save sample pages for study"
        required: false
        default: "mlalads"
      script:
        description: "probe script on the discovery branch (scripts/...)"
        required: false
        default: "discover7.py"
      out:
        description: "folder the script writes (committed to the discovery branch)"
        required: false
        default: "raw11"

permissions:
  contents: write
  actions: write   # to start "Update data and site" after new data is pushed

concurrency:
  group: india
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.task == 'probe'
    runs-on: [self-hosted, india]
    timeout-minutes: 30
    # cmd, not PowerShell: Windows blocks PowerShell scripts by default (execution
    # policy "Restricted"), and we leave that system setting alone.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: discovery
      - run: python -m pip install --quiet requests
      - run: python scripts/${{ inputs.script }}
      - name: Save samples to the discovery branch
        if: always()
        run: |
          git config user.name "nagarika-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.out }}
          git commit -m "Discovery samples ${{ inputs.out }} (from India)"
          git pull --rebase origin discovery && git push origin HEAD:discovery

  collect:
    if: inputs.task == 'mlalads' || inputs.task == 'education' || inputs.task == 'all'
    runs-on: [self-hosted, india]
    timeout-minutes: 150
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - if: inputs.task == 'mlalads' || inputs.task == 'all'
        run: python collector/mlalads.py
      - if: inputs.task == 'education' || inputs.task == 'all'
        run: python collector/edu_portals.py
      - name: Commit data
        run: |
          git config user.name "nagarika-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if exist data\mlalads git add data/mlalads
          if exist data\education git add data/education
          git diff --cached --quiet && echo No data changes && exit /b 0
          git commit -m "India sources update: ${{ inputs.task }}"
          git pull --rebase origin main && git push origin HEAD:main

  # Pushes made with the workflow's own token don't start other workflows, so ask for a
  # rebuild of the site explicitly (on GitHub's servers; nothing more runs on the laptop).
  publish:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run update.yml --repo "$GITHUB_REPOSITORY" -f sources=none
        env:
          GH_TOKEN: ${{ github.token }}
